name: Build Pygame Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"                      "platforms;android-35"                      "build-tools;35.0.0"                      "ndk;28.2.13676358"

      - name: Install Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y             git zip unzip autoconf automake libtool             pkg-config cmake libffi-dev zlib1g-dev             libjpeg-dev

      - name: Install python-for-android
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install python-for-android

      - name: Show p4a version
        run: |
          p4a --version
          p4a recipes | grep -E '^(sdl2|sdl2_image|sdl2_mixer|sdl2_ttf|pygame-ce)$' || true

      - name: Build APK
        env:
          ANDROIDAPI: "35"
          NDKAPI: "21"
        run: |
          mkdir -p build

          p4a apk             --private .             --local-recipes ./p4a-recipes             --package org.pygame.wkek             --name PygameGame             --version 1.0             --bootstrap sdl2             --requirements python3,pygame-ce             --arch arm64-v8a             --android-api 35             --ndk-api 21             --ndk-version 28.2.13676358             --orientation landscape             --debug             --output build/PygameGame.apk

      - name: Verify APK
        run: |
          test -f build/PygameGame.apk
          test -s build/PygameGame.apk
          ls -lh build/PygameGame.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PygameGame-APK
          path: build/PygameGame.apk
          retention-days: 14

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-${{ github.run_number }}"
          gh release create "$TAG"             build/PygameGame.apk             --title "Pygame APK $TAG"             --notes "Automatically built from GitHub Actions."
